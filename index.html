<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA">
<title>モニタリングノート</title>
<style>
:root{--ink:#24342e;--muted:#718078;--green:#3f745e;--green2:#e8f1eb;--cream:#f7f3ea;--orange:#efad65;--orange2:#fff1df;--line:#e5e1d7;--red:#b95d55}
*{box-sizing:border-box}body{margin:0;background:#ece9e1;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:var(--cream);padding-bottom:92px}.top{padding:22px 18px 10px}.top small{color:var(--muted)}h1{font-size:24px;margin:4px 0}h2{font-size:19px;margin:18px 0 8px}h3{font-size:16px}
.page{display:none;padding:0 16px 24px}.page.on{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 5px 18px #5b665b10}
.progress{height:12px;background:#e5e3dc;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:40%;background:var(--green)}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1}.name{font-size:18px;font-weight:800}.meta{font-size:13px;color:var(--muted);line-height:1.55}.pill{display:inline-block;background:var(--green2);color:var(--green);font-size:12px;font-weight:700;padding:5px 9px;border-radius:99px}.warn{background:var(--orange2);color:#986027}
button{font:inherit}.btn{border:0;border-radius:13px;padding:11px 14px;background:var(--green);color:#fff;font-weight:750}.ghost{background:#edf1ed;color:var(--green)}.round{width:44px;height:44px;border-radius:50%;font-size:25px;padding:0}
input,textarea,select{width:100%;font:inherit;border:1px solid #d9d7cf;background:#fff;border-radius:13px;padding:12px;margin:6px 0 14px;color:var(--ink)}textarea{min-height:130px;resize:vertical}label{font-size:13px;font-weight:750}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:7px 0 16px}.choice{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px}.choice.active{border-color:var(--green);background:var(--green2);color:var(--green);font-weight:750}
.note{background:#fff9ed;border:1px solid #f0d9b8;border-radius:18px;padding:15px}.note textarea{margin-bottom:4px;background:#fffdf8}
.timeline{border-left:2px solid #d7dfd8;margin-left:8px;padding-left:17px}.event{margin:0 0 18px}.event b{display:block}
.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;border:0;background:#fff;padding:10px 2px;color:#78847e;font-size:11px}.nav b{display:block;font-size:21px}.nav .sel{color:var(--green)}
.back{border:0;background:transparent;color:var(--green);padding:0;font-weight:700}.sectionHead{display:flex;justify-content:space-between;align-items:center}.special{border-left:5px solid var(--orange)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare>div{background:#fff;border:1px solid var(--line);padding:12px;border-radius:14px;font-size:13px}.changed{background:var(--orange2)!important;border-color:#efc38f!important}
.toast{display:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#24342e;color:#fff;border-radius:99px;padding:10px 16px;z-index:9;font-size:13px}
.empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body><main class="app">
<header class="top"><small>自分専用・端末内保存の試作版</small><h1>🌿 モニタリングノート</h1></header>

<section id="home" class="page on">
<div class="card"><div class="row between"><b>9月のモニタリング</b><b id="progText">2 / 5 完了</b></div><div class="progress" style="margin-top:12px"><i></i></div><p class="meta">あと3人。ひとつずつ片づけよう。</p></div>
<h2>今日やるといい人</h2>
<div id="homeUsers"></div>
</section>

<section id="users" class="page">
<div class="sectionHead"><h2>利用者</h2><button class="btn round" onclick="openRegister()">＋</button></div>
<input id="search" placeholder="識別名を検索" oninput="renderUsers()">
<div id="userList"></div>
</section>

<section id="history" class="page"><h2>モニタリング履歴</h2><div id="historyList"></div></section>

<section id="register" class="page">
<button class="back" onclick="go('users')">‹ 利用者へ戻る</button><h2>利用者を登録</h2>
<p class="meta">本名でなく「Aさん」など、自分だけ分かる識別名でも使えます。</p>
<label>識別名</label><input id="regName" placeholder="例：Aさん">
<label>生まれ月</label><select id="regMonth"><option value="">選択しない</option></select>
<label>利用開始日</label><input id="regStart" type="date">
<label>状態</label><select id="regState"><option>通常</option><option>新規</option><option>退院・支援再開後</option></select>
<label>支援再開日（必要な場合）</label><input id="regRestart" type="date">
<button class="btn" onclick="addUser()">登録する</button>
</section>

<section id="detail" class="page">
<button class="back" onclick="go('users')">‹ 利用者へ戻る</button>
<div id="detailBody"></div>
</section>

<section id="monitor" class="page">
<button class="back" onclick="openDetail(currentId)">‹ 利用者へ戻る</button><h2 id="monTitle">モニタリング</h2>
<p class="meta">タップ中心で確認。必要なところだけメモを残します。</p>
<div id="monitorFields"></div>
<div class="note"><h3>📝 特記事項・メモ</h3><p class="meta">今回いちばん残しておきたいこと。</p><textarea id="special" placeholder="気になった変化、本人の話、次回確認したいことなど"></textarea></div>
<label style="display:block;margin-top:15px">⭐ 次回の確認事項</label><textarea id="nextCheck" placeholder="例：歩行時のふらつきを再確認"></textarea>
<button class="btn" style="width:100%" onclick="saveMonitoring()">✓ 保存して完了</button>
</section>

<section id="result" class="page"><button class="back" onclick="openDetail(currentId)">‹ 利用者へ戻る</button><div id="resultBody"></div></section>

<div class="nav">
<button class="sel" onclick="go('home',this)"><b>⌂</b>ホーム</button>
<button onclick="go('users',this)"><b>♙</b>利用者</button>
<button onclick="go('history',this)"><b>◷</b>履歴</button>
</div>
<div id="toast" class="toast"></div>
</main>
<script>
const fields=['体調','食事・水分','排泄','睡眠','入浴・清潔','移動・歩行','認知・精神面','服薬','本人の意向','家族の意向','サービス実施状況','目標の状況'];
const seedUsers=[
{id:'u1',name:'Aさん',month:9,start:'2026-08-20',state:'新規',restart:'',next:'9/19'},
{id:'u2',name:'Bさん',month:9,start:'2024-04-01',state:'通常',restart:'',next:'9月'},
{id:'u3',name:'Cさん',month:3,start:'2025-06-10',state:'退院・支援再開後',restart:'2026-09-01',next:'9/30'}
];
const seedRecords=[
{id:'r1',uid:'u1',date:'2026-06-12',values:{'体調':'変化なし','食事・水分':'変化なし','排泄':'変化なし','睡眠':'変化なし','入浴・清潔':'変化なし','移動・歩行':'変化なし','認知・精神面':'変化なし','服薬':'変化なし','本人の意向':'変化なし','家族の意向':'変化なし','サービス実施状況':'変化なし','目標の状況':'変化なし'},special:'大きな変化なし。穏やかに過ごされている。',nextCheck:'歩行状態を継続確認'}
];
let users=JSON.parse(localStorage.getItem('mn_users')||'null')||seedUsers;
let records=JSON.parse(localStorage.getItem('mn_records')||'null')||seedRecords;
let currentId=null; let selections={};
function persist(){localStorage.setItem('mn_users',JSON.stringify(users));localStorage.setItem('mn_records',JSON.stringify(records))}
function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('sel'));if(b)b.classList.add('sel');scrollTo(0,0);if(id==='home')renderHome();if(id==='users')renderUsers();if(id==='history')renderHistory()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1500)}
function renderHome(){let box=document.getElementById('homeUsers');box.innerHTML=users.map((u,i)=>`<div class="card ${i<2?'special':''}" onclick="openDetail('${u.id}')"><span class="pill ${i<2?'warn':''}">${u.state}</span><div class="name" style="margin-top:9px">${u.name}</div><div class="meta">次回：${u.next||'未設定'}</div><button class="btn" onclick="event.stopPropagation();startMonitoring('${u.id}')">モニタリングする →</button></div>`).join('')}
function renderUsers(){let q=(document.getElementById('search')?.value||'').toLowerCase();let list=users.filter(u=>u.name.toLowerCase().includes(q));document.getElementById('userList').innerHTML=list.length?list.map(u=>`<div class="card" onclick="openDetail('${u.id}')"><div class="row between"><div><div class="name">${u.name}</div><div class="meta">${u.state} ｜ 次回 ${u.next||'未設定'}</div></div><b>›</b></div></div>`).join(''):`<div class="empty">利用者がいません</div>`}
function openRegister(){go('register')}
function addUser(){let n=document.getElementById('regName').value.trim();if(!n)return toast('識別名を入力してください');let m=document.getElementById('regMonth').value;users.push({id:'u'+Date.now(),name:n,month:m,start:regStart.value,state:regState.value,restart:regRestart.value,next:m?m+'月':'未設定'});persist();regName.value='';toast('登録しました');go('users')}
function latest(uid){return records.filter(r=>r.uid===uid).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function openDetail(id){currentId=id;let u=users.find(x=>x.id===id), r=latest(id);let prevSpecial=r?r.special:'まだ記録がありません';document.getElementById('detailBody').innerHTML=`<h2>${u.name}</h2><div class="card"><span class="pill">${u.state}</span><p><b>次回モニタリング：</b>${u.next||'未設定'}</p><p class="meta">利用開始 ${u.start||'未設定'}${u.restart?` ｜ 支援再開 ${u.restart}`:''}</p><button class="btn" onclick="startMonitoring('${u.id}')">モニタリングする →</button></div><h3>最新の特記事項</h3><div class="note">${prevSpecial}</div>${r&&r.nextCheck?`<div class="card"><b>⭐ 前回からの確認事項</b><p>${r.nextCheck}</p></div>`:''}<div class="row"><button class="btn ghost grow" onclick="showResult('${u.id}')">前回を見る</button><button class="btn ghost grow" onclick="showSpecialHistory('${u.id}')">特記事項履歴</button></div>`;go('detail')}
function startMonitoring(id){currentId=id;selections={};let u=users.find(x=>x.id===id);monTitle.textContent=u.name+'｜モニタリング';monitorFields.innerHTML=fields.map(f=>`<div><label>${f}</label><div class="choices" data-field="${f}">${['変化なし','良くなった','変化あり','要確認'].map(v=>`<button class="choice" onclick="pick(this,'${f}','${v}')">${v}</button>`).join('')}</div></div>`).join('');special.value='';nextCheck.value='';go('monitor')}
function pick(el,f,v){selections[f]=v;el.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function saveMonitoring(){let sp=special.value.trim();if(!sp&&!confirm('特記事項は空欄です。このまま保存しますか？'))return;let d=new Date().toISOString().slice(0,10);records.push({id:'r'+Date.now(),uid:currentId,date:d,values:{...selections},special:sp||'特記事項なし',nextCheck:nextCheck.value.trim()});persist();toast('✓ モニタリング完了！');showResult(currentId)}
function showResult(id){currentId=id;let u=users.find(x=>x.id===id), rs=records.filter(r=>r.uid===id).sort((a,b)=>b.date.localeCompare(a.date));if(!rs.length){toast('記録がありません');return}let cur=rs[0],prev=rs[1];let changed=fields.filter(f=>prev&&cur.values[f]&&cur.values[f]!==prev.values[f]);resultBody.innerHTML=`<h2>${u.name}｜モニタリング結果</h2><div class="card"><b>実施日 ${cur.date}</b><p class="meta">変化した項目：${changed.length?changed.join('・'):'大きな変化なし'}</p></div><h3>📝 今回の特記事項</h3><div class="note">${cur.special}</div><h3>前回との比較</h3>${prev?`<div class="compare"><div><b>前回 ${prev.date}</b><p>${prev.special}</p></div><div class="changed"><b>今回 ${cur.date}</b><p>${cur.special}</p></div></div>`:'<div class="card meta">比較できる前回記録がありません。</div>'}<button class="btn" style="width:100%;margin-top:14px" onclick="makeOutput('${id}')">前回との変化を出力</button><div id="outputBox"></div>`;go('result')}
function makeOutput(id){let u=users.find(x=>x.id===id),rs=records.filter(r=>r.uid===id).sort((a,b)=>b.date.localeCompare(a.date)),cur=rs[0],prev=rs[1];let changed=fields.filter(f=>prev&&cur.values[f]&&cur.values[f]!==prev.values[f]);let txt=`【${u.name} モニタリング】\n【前回との変化】\n${prev?(changed.length?changed.map(f=>`${f}：前回「${prev.values[f]||'未入力'}」→今回「${cur.values[f]}」`).join('\n'):'確認項目に大きな変化なし。'):'前回記録なし。'}\n\n【前回特記事項】\n${prev?prev.special:'なし'}\n\n【今回特記事項】\n${cur.special}\n\n【次回確認事項】\n${cur.nextCheck||'なし'}`;outputBox.innerHTML=`<h3>コピー用</h3><textarea id="outText">${txt}</textarea><button class="btn ghost" onclick="copyText()">コピー</button>`}
function copyText(){navigator.clipboard.writeText(outText.value);toast('コピーしました')}
function showSpecialHistory(id){let u=users.find(x=>x.id===id),rs=records.filter(r=>r.uid===id).sort((a,b)=>b.date.localeCompare(a.date));detailBody.innerHTML=`<button class="back" onclick="openDetail('${id}')">‹ ${u.name}へ戻る</button><h2>特記事項の履歴</h2><div class="timeline">${rs.map(r=>`<div class="event"><b>${r.date}</b><span>${r.special}</span></div>`).join('')||'記録なし'}</div>`}
function renderHistory(){let rs=[...records].sort((a,b)=>b.date.localeCompare(a.date));historyList.innerHTML=rs.length?rs.map(r=>{let u=users.find(x=>x.id===r.uid);return `<div class="card" onclick="showResult('${r.uid}')"><b>${r.date}　✓ ${u?u.name:'利用者'}</b><p class="meta">${r.special}</p></div>`}).join(''):'<div class="empty">まだ履歴がありません</div>'}
for(let i=1;i<=12;i++)regMonth.innerHTML+=`<option value="${i}">${i}月</option>`;
renderHome();renderUsers();renderHistory();persist();
</script></body></html>
